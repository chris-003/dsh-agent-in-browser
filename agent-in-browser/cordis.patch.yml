# @chris/agent-in-browser profile bundle patch.
# Loaded by the dsh profile (`dsh.profile.bundles`). Mounts the plugin row that
# starts the WebSocket server and registers the browser tools.
- insert:
    - id: agent-in-browser
      name: '@chris/agent-in-browser'
      config:
        port: 38745
        token: agent-in-browser
        host: 127.0.0.1
        commandTimeoutMs: 30000
